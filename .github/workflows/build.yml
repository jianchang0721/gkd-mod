name: build

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd keystore
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - name: run mod unit tests
        run: ./gradlew :gkd-app:jvmTest --tests "li.gkd.app.root.*" --tests "li.gkd.app.ui.style.*" --tests "li.gkd.app.ui.GkdLinkTest"

      - run: ./gradlew :gkd-android:assembleGkdRelease
        env:
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_API_AUTH_TOKEN: ${{ secrets.GKD_API_AUTH_TOKEN }}
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          GKD_RENAME_PACKAGE_FLAG: "1"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: gkd-android/build/outputs/apk/gkd/release/*.apk

      - name: derive outputs artifact name from APK
        id: outputs-artifact
        shell: bash
        run: |
          apk_files=(gkd-android/build/outputs/apk/gkd/release/gkd-v*.apk)
          [[ ${#apk_files[@]} -eq 1 && -f "${apk_files[0]}" ]]
          apk_name=$(basename "${apk_files[0]}" .apk)
          echo "name=${apk_name}.outputs" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.outputs-artifact.outputs.name }}
          path: gkd-android/build/outputs

      # 把 APK 推到 dist 分支: 无需任何凭据即可下载 (公开仓库)
      - name: publish apk to dist branch
        shell: bash
        run: |
          set -e
          apk_files=(gkd-android/build/outputs/apk/gkd/release/*.apk)
          [[ ${#apk_files[@]} -eq 1 && -f "${apk_files[0]}" ]]
          apk="${apk_files[0]}"
          mkdir -p /tmp/dist
          cp "$apk" "/tmp/dist/$(basename "$apk")"
          printf '%s\n' "${{ github.sha }}" > /tmp/dist/COMMIT.txt
          cd /tmp/dist
          git init -q -b dist
          git config user.name "gkd-mod-ci"
          git config user.email "gkd-mod-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "apk: $(basename "$apk") @ ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

